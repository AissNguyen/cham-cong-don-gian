<!DOCTYPE html>
<html lang="vi">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Chấm công đơn giản: ghi giờ vào/ra, tăng ca, ngày nghỉ và ước tính lương theo kỳ.">
  <meta name="theme-color" content="#1CAE8F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Chấm Công">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Chấm Công Đơn Giản</title>
  <link rel="manifest" href="manifest.json">

  <!-- Tải trước các file nặng song song với file khởi động, để app hiện lên nhanh hơn. -->
  <link rel="preload" href="main.dart.js" as="script">

  <style>
    html, body { margin: 0; height: 100%; background: #F3F5F4; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #4A5A56;
      transition: opacity .25s;
    }
    #splash img { width: 88px; height: 88px; border-radius: 22px; }
    #splash .bar { width: 120px; height: 4px; border-radius: 2px; background: #D6E6E2; overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #1CAE8F;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <!-- Màn chờ trong lúc tải app; tự ẩn khi app đã vẽ xong khung hình đầu tiên. -->
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div>Đang mở Chấm Công…</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 300);
    });
    // Lưu sẵn app trong máy để lần sau mở nhanh và dùng được khi mất mạng (xem sw.js).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
